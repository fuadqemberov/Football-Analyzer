name: Diag mackolik (temporary)
on:
  push:
    branches: [diag-mackolik]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probes
        run: |
          T='https://arsiv.mackolik.com/Team/Default.aspx?id=451&season=2026/2027'
          F='https://arsiv.mackolik.com/AjaxHandlers/FixtureHandler.aspx?command=getWeeks&id=70381'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          p() { # label url curl-args...
            local l="$1" u="$2"; shift 2
            local r; r=$(curl -sS -m 40 -A "$UA" -o body.bin -w '%{http_code} %{size_download}B ip=%{remote_ip}' "$@" "$u" 2>&1 | tail -1)
            echo "[$l] $r tblFixture=$(grep -c tblFixture body.bin 2>/dev/null) | $u"
          }
          exec > results.txt 2>&1
          echo "== direct ($(curl -s -m 10 https://api.ipify.org))"
          p direct "$T"
          for h in m.mackolik.com mobile.mackolik.com arsiv2.mackolik.com eski.mackolik.com; do
            p "host $h" "https://$h/Team/Default.aspx?id=451&season=2026/2027"; done
          p "vd team?" "https://vd.mackolik.com/Team/Default.aspx?id=451&season=2026/2027"

          echo "== TOR"
          sudo apt-get install -y -qq tor >/dev/null 2>&1; sudo systemctl start tor || true
          for i in $(seq 1 30); do curl -s -m 10 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org >/dev/null && break; sleep 3; done
          for i in 1 2 3; do
            echo "tor exit: $(curl -s -m 20 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org)"
            p "tor#$i team" "$T" --socks5-hostname 127.0.0.1:9050
            p "tor#$i fixture" "$F" --socks5-hostname 127.0.0.1:9050
            sudo systemctl reload tor || sudo killall -HUP tor || true; sleep 8
          done

          echo "== WARP"
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq cloudflare-warp >/dev/null 2>&1
          sleep 3
          warp-cli --accept-tos registration new 2>&1 | tail -1
          warp-cli --accept-tos mode proxy 2>&1 | tail -1
          warp-cli --accept-tos connect 2>&1 | tail -1
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status | head -3
          echo "warp proxy ip: $(curl -s -m 15 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org)"
          p "warp-proxy team" "$T" --socks5-hostname 127.0.0.1:40000
          p "warp-proxy fixture" "$F" --socks5-hostname 127.0.0.1:40000
          p "warp-proxy vd" "https://vd.mackolik.com/livedata?group=all" --socks5-hostname 127.0.0.1:40000
          echo "-- tunnel mode"
          warp-cli --accept-tos mode warp 2>&1 | tail -1
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status | head -3
          echo "warp tunnel ip: $(curl -s -m 15 https://api.ipify.org)"
          p "warp-tunnel team" "$T"
          p "warp-tunnel fixture" "$F"
          p "warp-tunnel github" "https://api.github.com/zen"
          warp-cli --accept-tos disconnect 2>&1 | tail -1
          echo "after disconnect ip: $(curl -s -m 15 https://api.ipify.org)"
      - name: Commit results
        if: always()
        run: |
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add -f results.txt && git commit -m "diag2 results" && git push
