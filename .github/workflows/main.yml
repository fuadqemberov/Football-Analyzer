name: Daily All Analyzers

on:
  schedule:
    # 9 saat geri çekildi: eski 06:30 UTC → 21:30 UTC (bir önceki gün).
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    # Adım limitlerinin toplamı (250dk) + derleme/kurulum payı.
    timeout-minutes: 300

    env:
      # Geçmiş sezon sayfaları değişmez veridir. Bu dizin adımlar arasında
      # paylaşıldığı için temas/dongu/xthmatch aynı sayfayı bir kez indirir
      # (~3 kat az istek → çok daha az timeout).
      MACKOLIK_CACHE_DIR: ${{ github.workspace }}/.mackolik-cache

      # Çıktı .txt dosyaya yönlendirildiği için Java System.out'u konsol değil,
      # "native.encoding" (yani runner'ın locale'i) ile yazar. Locale UTF-8
      # değilse ⭐ ve 🎯 gibi karakterler eke "?" olarak düşer. Aşağıdakiler
      # hem locale'i hem de JVM'in stdout kodlamasını UTF-8'e sabitler.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          # 22, pom.xml'deki maven.compiler.source/target ile aynı olmalı: kod
          # adsız değişken (catch (Exception _)) kullanıyor, bu Java 22'de kesinleşti.
          # JDK 21 ile derleme "release 22" isteğini karşılayamaz.
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      # Geçmiş sezonlar değişmediği için önbellek günler arasında da taşınır:
      # ertesi gün yalnızca güncel sezon + yeni takımların geçmişi indirilir.
      # Anahtar her çalışmada benzersiz, restore-keys ile en son önbellek geri
      # yüklenir → her koşu bir öncekinin üstüne ekleyerek büyür.
      - name: Restore mackolik season cache
        uses: actions/cache@v4
        with:
          path: .mackolik-cache
          key: mackolik-cache-${{ github.run_id }}
          restore-keys: |
            mackolik-cache-

      - name: Prune stale cache entries
        run: |
          mkdir -p .mackolik-cache
          # Koddaki 30 günlük TTL ile aynı: bayat girdiler zaten kullanılmıyor, diskten de silinsin.
          find .mackolik-cache -type f -mtime +30 -delete || true
          echo "Önbellek: $(find .mackolik-cache -type f | wc -l) dosya, $(du -sh .mackolik-cache | cut -f1)"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          google-chrome --version || chromium --version || chromium-browser --version || true

      - name: Compile
        run: mvn -B compile -DskipTests

      - name: 1) NowGoalTeamRoundHTFT
        run: |
          echo "===== NowGoalTeamRoundHTFT START =====" > team_round.txt
          timeout -k 30 25m mvn -B exec:java \
            -Dexec.mainClass="analyzer.nowgoal.NowGoalTeamRoundHTFT" \
            -Dexec.classpathScope=compile \
            >> team_round.txt 2>&1 || echo "[workflow] step timed out or failed (exit $?)" >> team_round.txt
          echo "===== NowGoalTeamRoundHTFT END =====" >> team_round.txt
          tail -n 20 team_round.txt

      - name: 2) NowGoalHTFT
        run: |
          echo "===== NowGoalHTFT START =====" > nowgoal_htft.txt
          timeout -k 30 25m mvn -B exec:java \
            -Dexec.mainClass="analyzer.nowgoal.NowGoalHTFT" \
            -Dexec.classpathScope=compile \
            >> nowgoal_htft.txt 2>&1 || echo "[workflow] step timed out or failed (exit $?)" >> nowgoal_htft.txt
          echo "===== NowGoalHTFT END =====" >> nowgoal_htft.txt
          tail -n 20 nowgoal_htft.txt

      # Mackolik analizörleri 1500+ takım × ~20 sezon tarıyor; 25dk'ya sığmıyordu
      # ve tarama yarıda kesiliyordu. İlk çalışan temas önbelleği soğuktan
      # doldurduğu için en geniş bütçe onda.
      - name: 3) TemasTakimiAnalyzer
        run: |
          echo "===== TemasTakimiAnalyzer START =====" > temas.txt
          timeout -k 30 60m mvn -B exec:java \
            -Dexec.mainClass="analyzer.mackolik.temas.TemasTakimiAnalyzer" \
            -Dexec.classpathScope=compile \
            >> temas.txt 2>&1 || echo "[workflow] step timed out or failed (exit $?)" >> temas.txt
          echo "===== TemasTakimiAnalyzer END =====" >> temas.txt
          tail -n 20 temas.txt

      - name: 4) HaftaDonguAnalyzer
        run: |
          echo "===== HaftaDonguAnalyzer START =====" > hafta_dongu.txt
          timeout -k 30 45m mvn -B exec:java \
            -Dexec.mainClass="analyzer.mackolik.dongu.HaftaDonguAnalyzer" \
            -Dexec.classpathScope=compile \
            >> hafta_dongu.txt 2>&1 || echo "[workflow] step timed out or failed (exit $?)" >> hafta_dongu.txt
          echo "===== HaftaDonguAnalyzer END =====" >> hafta_dongu.txt
          tail -n 20 hafta_dongu.txt

      - name: 5) SeasonXthOfficialMatchAnalyzer
        run: |
          echo "===== SeasonXthOfficialMatchAnalyzer START =====" > season_xth.txt
          timeout -k 30 45m mvn -B exec:java \
            -Dexec.mainClass="analyzer.mackolik.xthmatch.SeasonXthOfficialMatchAnalyzer" \
            -Dexec.classpathScope=compile \
            >> season_xth.txt 2>&1 || echo "[workflow] step timed out or failed (exit $?)" >> season_xth.txt
          echo "===== SeasonXthOfficialMatchAnalyzer END =====" >> season_xth.txt
          tail -n 20 season_xth.txt

      - name: 6) SezonDenklemiAnalyzer
        run: |
          echo "===== SezonDenklemiAnalyzer START =====" > sezon_denklemi.txt
          timeout -k 30 45m mvn -B exec:java \
            -Dexec.mainClass="analyzer.mackolik.triplepattern.SezonDenklemiAnalyzer" \
            -Dexec.classpathScope=compile \
            >> sezon_denklemi.txt 2>&1 || echo "[workflow] step timed out or failed (exit $?)" >> sezon_denklemi.txt
          echo "===== SezonDenklemiAnalyzer END =====" >> sezon_denklemi.txt
          tail -n 20 sezon_denklemi.txt

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily All 6 Analyzers - #${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Günlük 6 analiz tamamlandı (01:30 Bakı).

            1) NowGoalTeamRoundHTFT           → team_round.txt
            2) NowGoalHTFT                    → nowgoal_htft.txt
            3) TemasTakimiAnalyzer            → temas.txt
            4) HaftaDonguAnalyzer             → hafta_dongu.txt
            5) SeasonXthOfficialMatchAnalyzer → season_xth.txt
            6) SezonDenklemiAnalyzer          → sezon_denklemi.txt

            Not: Hər analiz üçün vaxt limiti var (mackolik analizləri 45-60 dəq, digərləri 25 dəq);
            bir analiz donsa belə iş dayanmır və email gəlir.
            Kəsilmə olubsa faylın sonunda "[workflow] step timed out or failed" sətri görünür.

            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: team_round.txt,nowgoal_htft.txt,temas.txt,hafta_dongu.txt,season_xth.txt,sezon_denklemi.txt
