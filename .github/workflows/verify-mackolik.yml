name: Verify mackolik fix (temporary)
on:
  push:
    branches: [verify-mackolik]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"
      MACKOLIK_CACHE_DIR: ${{ github.workspace }}/.mackolik-cache
      MACKOLIK_TOR_PORTS: "9060-9075"
      MACKOLIK_TOR_CONTROL: "9151"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      # arsiv.mackolik.com bulud IP-lərini 403 ilə bloklayır, arsiv2 isə bir IP-yə
      # ~40 sorğu verib 429 qaytarır. Tor-un hər SOCKS portu ayrı çıxış IP-sidir;
      # MackolikHttpFetcher limit dolanda portu dəyişir və ControlPort-dan NEWNYM
      # ilə yeni IP-lər alır. Tor başlamasa analizlər birbaşa bağlantı ilə davam edir.
      - name: Start Tor (mackolik IP limiti)
        run: |
          sudo apt-get install -y -qq tor > /dev/null 2>&1 || sudo apt-get install -y tor
          sudo systemctl stop tor tor@default 2>/dev/null || true
          sudo pkill -x tor || true; sleep 1
          TD="$RUNNER_TEMP/tor"; mkdir -p "$TD" && chmod 700 "$TD"
          { for p in $(seq 9060 9075); do echo "SocksPort $p"; done
            echo "ControlPort 9151"; echo "CookieAuthentication 0"; echo "DataDirectory $TD"; } > "$RUNNER_TEMP/torrc"
          nohup tor -f "$RUNNER_TEMP/torrc" > "$RUNNER_TEMP/tor.log" 2>&1 &
          for i in $(seq 1 90); do grep -q "Bootstrapped 100" "$RUNNER_TEMP/tor.log" && break; sleep 2; done
          if grep -q "Bootstrapped 100" "$RUNNER_TEMP/tor.log"; then
            echo "Tor hazırdır: $(curl -s -m 20 --socks5 127.0.0.1:9060 https://api.ipify.org)"
          else
            echo "Tor başlamadı — mackolik birbaşa bağlantı ilə işləyəcək"; tail -20 "$RUNNER_TEMP/tor.log"
            echo "MACKOLIK_TOR_PORTS=" >> "$GITHUB_ENV"
          fi

      - name: Compile
        run: mvn -B -q compile -DskipTests > compile.txt 2>&1 || { tail -60 compile.txt; exit 1; }
      - name: Run analyzers (time-boxed)
        run: |
          mkdir -p out
          for c in analyzer.mackolik.xthmatch.SeasonXthOfficialMatchAnalyzer analyzer.mackolik.temas.TemasTakimiAnalyzer analyzer.mackolik.dongu.HaftaDonguAnalyzer analyzer.mackolik.triplepattern.SezonDenklemiAnalyzer; do
            n=${c##*.}; s=$(date +%s)
            timeout -k 20 10m mvn -B -q exec:java -Dexec.mainClass="$c" -Dexec.classpathScope=compile > out/$n.txt 2>&1 || echo "[exit $?]" >> out/$n.txt
            echo "[elapsed $(( $(date +%s)-s ))s]" >> out/$n.txt
          done
      - name: Summarize & commit
        if: always()
        run: |
          {
          echo "compile: $(grep -c ERROR compile.txt 2>/dev/null) error lines"
          grep -E "ERROR" compile.txt | head -20
          for f in out/*.txt; do
            echo "################ $f ($(wc -l < $f) lines)"
            tr '\r' '\n' < $f | grep -E "Tor çıxışı|Keçici xəta|HTTP [0-9]{3} \(vaz|hostuna|istek özeti|İstek özeti|TAMAMLANDI|Bulunan|NƏTİCƏ|tapılan|exit|elapsed" | cut -c1-400 | tail -n 25
            tr '\r' '\n' < $f | grep -oE "İstek: .*" | tail -1 | cut -c1-400
          done
          } > verify.txt
          git config user.name verify-bot; git config user.email verify@users.noreply.github.com
          git add -f verify.txt out && git commit -m "verify results" && git push
