name: NowGoal TeamRound HTFT

on:
  schedule:
    # 15:00 Bakı = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:  # Manual test üçün

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          google-chrome --version || chromium --version || chromium-browser --version || true

      - name: Compile
        run: mvn -B compile -DskipTests

      - name: Run NowGoalTeamRoundHTFT
        run: |
          mvn -B exec:java \
            -Dexec.mainClass="analyzer.nowgoal.NowGoalTeamRoundHTFT" \
            -Dexec.classpathScope=compile \
            > output.txt 2>&1 || true
          echo "===== JOB END =====" >> output.txt
          wc -l output.txt
          tail -n 50 output.txt

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "NowGoalTeamRoundHTFT - ${{ github.run_number }} - ${{ github.run_id }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            NowGoalTeamRoundHTFT işi bitdi.
            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: output.txt
