name: Mackolik + NowGoal 12:30

on:
  schedule:
    # 12:30 Bakı = 08:30 UTC
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          google-chrome --version || chromium --version || chromium-browser --version || true

      - name: Compile
        run: mvn -B compile -DskipTests

      - name: Run NowGoalHTFT
        run: |
          echo "===== NowGoalHTFT START =====" > nowgoal_htft.txt
          mvn -B exec:java \
            -Dexec.mainClass="analyzer.nowgoal.NowGoalHTFT" \
            -Dexec.classpathScope=compile \
            >> nowgoal_htft.txt 2>&1 || true
          echo "===== NowGoalHTFT END =====" >> nowgoal_htft.txt
          tail -n 30 nowgoal_htft.txt

      - name: Run TemasTakimiAnalyzer
        run: |
          echo "===== TemasTakimiAnalyzer START =====" > temas.txt
          mvn -B exec:java \
            -Dexec.mainClass="analyzer.mackolik.temas.TemasTakimiAnalyzer" \
            -Dexec.classpathScope=compile \
            >> temas.txt 2>&1 || true
          echo "===== TemasTakimiAnalyzer END =====" >> temas.txt
          tail -n 30 temas.txt

      - name: Run LeagueWidePatternAnalyzer
        run: |
          echo "===== LeagueWidePatternAnalyzer START =====" > league_wide.txt
          mvn -B exec:java \
            -Dexec.mainClass="analyzer.mackolik.triplepattern.LeagueWidePatternAnalyzer" \
            -Dexec.classpathScope=compile \
            >> league_wide.txt 2>&1 || true
          echo "===== LeagueWidePatternAnalyzer END =====" >> league_wide.txt
          tail -n 30 league_wide.txt

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Mackolik+NowGoal 12:30 - run #${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            12:30 Bakı işi bitdi.
            3 sinif işə salındı:
            1) NowGoalHTFT
            2) TemasTakimiAnalyzer
            3) LeagueWidePatternAnalyzer

            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: nowgoal_htft.txt,temas.txt,league_wide.txt
